<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Prints</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">Quick <span>Prints</span></div>
      <ul class="sidebar-nav">
        <li><a href="#" data-view="templates" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span data-i18n="templates">Templates</span>
        </a></li>
        <li><a href="https://bullishrobr-dev.github.io/zero-backhand/" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span>Zero Backhand</span>
        </a></li>
        <li><a href="#" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.67 15 1.65 1.65 0 003 13.5V13a2 2 0 012-2h.09A1.65 1.65 0 006.6 9.4a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 0011.4 5.1V5a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001.51 1 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V11a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span data-i18n="settings">Settings</span>
        </a></li>
      </ul>
      <!-- Receipt preview lives in sidebar during editing -->
      <div class="sidebar-preview" id="sidebar-preview">
        <div class="sidebar-preview-header">Preview</div>
        <div class="sidebar-preview-body">
          <div class="receipt-preview" id="sidebar-receipt-preview"></div>
        </div>
      </div>
      <div class="sidebar-footer">v2.0 &middot; Offline</div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Header -->
      <header class="main-header" id="main-header">
        <h1 id="page-title">Quick Prints</h1>
        <p id="page-subtitle">Print business cards, vouchers, and skincare plans straight to the thermal printer.</p>
      </header>

      <!-- Templates View -->
      <section class="view active" id="view-templates">
        <div class="main-body">
          <div class="lang-switcher" id="lang-switcher"></div>
          <div class="templates-grid" id="templates-grid"></div>
        </div>
      </section>

      <!-- Editor View -->
      <section class="view" id="view-editor">
        <div class="main-body" style="padding:0;">
          <div class="editor-layout">
            <div class="editor-form-panel">
              <div class="editor-form-header" id="editor-form-title">Template</div>
              <div class="editor-form-body" id="editor-form-body"></div>
            </div>
            <div class="editor-preview-panel">
              <div class="editor-preview-header">Preview</div>
              <div class="editor-preview-body">
                <div class="receipt-print-wrapper">
                  <div class="receipt-preview" id="receipt-preview"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Settings View -->
      <section class="view" id="view-settings">
        <div class="main-body">
          <div class="lang-switcher" id="lang-switcher-settings"></div>

          <!-- Shop Info -->
          <div class="settings-section">
            <div class="settings-section-header" data-i18n="shopInfo">Shop Information</div>
            <div class="settings-section-body">
              <div class="settings-grid">
                <div class="form-group">
                  <label data-i18n="shopName">Shop Name</label>
                  <input type="text" id="shop-name">
                </div>
                <div class="form-group">
                  <label data-i18n="shopTagline">Shop Tagline</label>
                  <input type="text" id="shop-tagline" placeholder="e.g. Your Skin, Refined.">
                </div>
                <div class="form-group">
                  <label data-i18n="email">Email</label>
                  <input type="text" id="shop-email">
                </div>
                <div class="form-group">
                  <label data-i18n="phone">Phone</label>
                  <input type="text" id="shop-phone">
                </div>
                <div class="form-group">
                  <label data-i18n="whatsapp">WhatsApp</label>
                  <input type="text" id="shop-whatsapp">
                </div>
                <div class="form-group">
                  <label data-i18n="website">Website</label>
                  <input type="text" id="shop-website">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                  <label data-i18n="logoUpload">Logo</label>
                  <div style="display:flex;gap:10px;align-items:center;">
                    <input type="file" id="shop-logo-file" accept="image/*" style="flex:1;">
                    <button class="btn btn-ghost btn-sm" id="btn-clear-logo" type="button">&times;</button>
                  </div>
                  <img class="logo-preview" id="logo-preview" style="display:none;">
                </div>
              </div>
            </div>
          </div>

          <!-- Locations -->
          <div class="settings-section">
            <div class="settings-section-header">
              <span data-i18n="locations">Locations</span>
              <button class="btn btn-sm btn-secondary" id="btn-add-location">+ <span data-i18n="add">Add</span></button>
            </div>
            <div class="settings-section-body" id="locations-list"></div>
          </div>

          <!-- Opening Hours -->
          <div class="settings-section">
            <div class="settings-section-header" data-i18n="openingHours">Opening Hours</div>
            <div class="settings-section-body">
              <div class="form-group">
                <input type="text" id="shop-hours" placeholder="Mon-Sun: 09:00 - 18:00">
              </div>
            </div>
          </div>

          <!-- Workers -->
          <div class="settings-section">
            <div class="settings-section-header">
              <span data-i18n="workers">Workers</span>
              <button class="btn btn-sm btn-secondary" id="btn-add-worker">+ <span data-i18n="addWorker">Add Worker</span></button>
            </div>
            <div class="settings-section-body" id="workers-list"></div>
          </div>

          <!-- Danger Zone -->
          <div class="settings-section">
            <div class="settings-section-header" data-i18n="dangerZone">Danger Zone</div>
            <div class="settings-section-body">
              <button class="btn btn-danger btn-sm" id="btn-reset-all" data-i18n="resetAllData">Reset All Data to Defaults</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
