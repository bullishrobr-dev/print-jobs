<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Prints — Zero Lines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">Quick <span>Prints</span></div>
      <ul class="sidebar-nav">
        <li><a href="#" data-view="templates" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Templates</span>
        </a></li>
        <li><a href="#" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.67 15 1.65 1.65 0 003 13.5V13a2 2 0 012-2h.09A1.65 1.65 0 006.6 9.4a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 0011.4 5.1V5a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001.51 1 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V11a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Settings</span>
        </a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Header -->
      <header class="main-header" id="main-header">
        <h1 id="page-title">Quick prints</h1>
        <p id="page-subtitle">Print business cards, vouchers, and skincare plans straight to the thermal printer.</p>
      </header>

      <!-- Templates View -->
      <section class="view active" id="view-templates">
        <div class="main-body">
          <div class="templates-grid" id="templates-grid"></div>
        </div>
      </section>

      <!-- Editor View -->
      <section class="view" id="view-editor">
        <div class="main-body" style="padding:0; height:100%;">
          <div class="editor-layout">
            <!-- Form Panel -->
            <div class="editor-form-panel">
              <div class="editor-form-header" id="editor-form-title">Discount voucher</div>
              <div class="editor-form-body" id="editor-form-body"></div>
            </div>
            <!-- Preview Panel -->
            <div class="editor-preview-panel">
              <div class="editor-preview-header">Preview</div>
              <div class="editor-preview-body">
                <div class="receipt-print-wrapper">
                  <div class="receipt-preview" id="receipt-preview"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Settings View -->
      <section class="view" id="view-settings">
        <div class="main-body">
          <!-- Shop Info -->
          <div class="settings-section">
            <div class="settings-section-header">Shop Information</div>
            <div class="settings-section-body">
              <div class="settings-grid">
                <div class="form-group"><label>Shop Name</label><input type="text" id="shop-name"></div>
                <div class="form-group"><label>Email</label><input type="text" id="shop-email"></div>
                <div class="form-group"><label>Phone / WhatsApp</label><input type="text" id="shop-phone"></div>
                <div class="form-group"><label>Logo URL or Base64</label><input type="text" id="shop-logo" placeholder="https://... or paste base64"></div>
              </div>
            </div>
          </div>

          <!-- Locations -->
          <div class="settings-section">
            <div class="settings-section-header">Locations <button class="btn btn-sm btn-secondary" id="btn-add-location">+ Add</button></div>
            <div class="settings-section-body" id="locations-list"></div>
          </div>

          <!-- Opening Hours -->
          <div class="settings-section">
            <div class="settings-section-header">Opening Hours</div>
            <div class="settings-section-body">
              <div class="hours-grid" id="hours-grid"></div>
            </div>
          </div>

          <!-- Workers -->
          <div class="settings-section">
            <div class="settings-section-header">Workers <button class="btn btn-sm btn-secondary" id="btn-add-worker">+ Add Worker</button></div>
            <div class="settings-section-body" id="workers-list"></div>
          </div>

          <!-- Danger Zone -->
          <div class="settings-section">
            <div class="settings-section-header">Danger Zone</div>
            <div class="settings-section-body">
              <button class="btn btn-danger btn-sm" id="btn-reset-all">Reset All Data to Defaults</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
